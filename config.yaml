# RAG Pipeline Configuration
# All tunable parameters are centralized here.

chunking:
  chunk_size: 512       # max tokens per chunk
  overlap: 50           # overlapping tokens between consecutive chunks

embeddings:
  provider: "local"                # "local" (free) or "openai" (requires API key)
  model: "all-MiniLM-L6-v2"       # sentence-transformers model for local mode
  dimension: 384                   # 384 for all-MiniLM-L6-v2, 1536 for text-embedding-3-small

retrieval:
  top_k: 5
  score_threshold: 0.5  # cosine similarity — drop results below this

generation:
  provider: "local"       # "local" (Ollama, free) or "openai" (requires API key)
  model: "llama3.2"       # Ollama model for local mode, or e.g. "gpt-4o-mini" for openai
  temperature: 0.2
  max_tokens: 1024

vector_store:
  provider: "chroma"
  persist_dir: "data/processed/chroma_db"
  collection_name: "rag_documents"
